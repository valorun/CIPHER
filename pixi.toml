[project]
name = "CIPHER"
version = "0.1.0"
description = "Add a short description here"
authors = ["valorun <ronan@collier-famille.fr>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]

[dependencies]
python = "==3.13.12"
llama-cpp-python = "*"
numpy = ">=2.2.6,<2.3.dev0"

[pypi-dependencies]
eventlet = ">=0.40.4, <0.41"
Flask = ">=3.1.3, <4"
Flask-Bcrypt = ">=1.0.1, <2"
Flask-MQTT = ">=1.3.0, <2"
Flask-SocketIO = ">=5.6.1, <6"
Flask-SQLAlchemy = ">=3.1.1, <4"
markupsafe = ">=3.0.3, <4"
dnspython = ">=2.4.0"

# Hearing dependencies
ollama = ">=0.6.1"
meteofrance-api = ">=1.5.0, <2"
requests = ">=2.21.0"
# Speech dependencies
pyaudio = "*"
onnxruntime = "*"
soundfile = "*"
phonemizer = "*"
huggingface-hub = "*"

[feature.dev.pypi-dependencies]
ipython = "*"
ipykernel = "*"
matplotlib = "*"
dspy = ">=3.1.3"
neutts = "*"

[environments]
dev = ["dev"]
